<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💬 Cyber AI Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Rubik&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      border-radius: 20px;
      width: 90%;
      max-width: 700px;
      padding: 25px;
    }

    h2 {
      text-align: center;
      color: #00ffe7;
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 20px;
    }

    #chatbox {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      height: 370px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 15px;
      font-size: 14px;
      position: relative;
      line-height: 1.4;
    }

    .user {
      background: #00ffc3;
      align-self: flex-end;
      color: #000;
      border-bottom-right-radius: 0;
    }

    .bot {
      background: #3949ab;
      align-self: flex-start;
      color: white;
      border-bottom-left-radius: 0;
      display: flex;
      align-items: center;
    }

    .bot img {
      height: 26px;
      margin-right: 10px;
      border-radius: 50%;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input[type="text"] {
      flex-grow: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    button {
      padding: 12px 20px;
      background: #00bcd4;
      color: white;
      font-size: 15px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .warning {
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      color: #f9a825;
    }

    .typing {
      font-style: italic;
      color: #aaa;
    }
  </style>
</head>
<body>
  <audio id="ping-sound" src="{{ url_for('static', filename='sounds/ping.mp3') }}"></audio>

  <div class="container">
    <h2>🤖 Cybersecurity AI Chatbot</h2>
    <div id="chatbox"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask about threats or security tips..." autocomplete="off" />
      <button onclick="sendMessage()">Send</button>
    </div>
    <p class="warning">⚠ Your IP & location are logged for security threat analysis.</p>
  </div>

 <script>
  async function sendMessage() {
    const input = document.getElementById("userInput");
    const chatbox = document.getElementById("chatbox");
    const message = input.value.trim();
    if (!message) return;

    // User message bubble
    const userBubble = document.createElement("div");
    userBubble.className = "bubble user";
    userBubble.innerHTML = `<strong>You:</strong> ${message}`;
    chatbox.appendChild(userBubble);
    input.value = "";

    // Typing animation
    const typingBubble = document.createElement("div");
    typingBubble.className = "bubble bot typing";
    typingBubble.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/4712/4712107.png" width="24"> Bot is typing...`;
    chatbox.appendChild(typingBubble);
    chatbox.scrollTop = chatbox.scrollHeight;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await res.json();
      chatbox.removeChild(typingBubble);

      const botBubble = document.createElement("div");
      botBubble.className = "bubble bot";
      botBubble.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/4712/4712107.png" width="24"><span><strong>Bot:</strong> ${data.reply}</span>`;
      chatbox.appendChild(botBubble);

      // Threat warning
      if (data.threat_detected) {
        const warning = document.createElement("div");
        warning.className = "meta";
        warning.innerHTML = `⚠ Threat Detected: ${data.threats.join(", ")}`;
        chatbox.appendChild(warning);
      }

      // 🔊 Play sound
      document.getElementById("ping-sound").play();

      chatbox.scrollTop = chatbox.scrollHeight;
    } catch (err) {
      chatbox.removeChild(typingBubble);
      const errorBubble = document.createElement("div");
      errorBubble.className = "bubble bot";
      errorBubble.innerHTML = `<strong>Bot:</strong> ❌ Error processing your message.`;
      chatbox.appendChild(errorBubble);
      console.error("Chat error:", err);
    }
  }
</script>

</body>
</html>
